<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IELTS Listening · Introduction</title>
<style>
  :root {
    --purple: #9B72B8;
    --purpled: #4A2060;
    --pink: #E87BAD;
    --light-pk: #FBE7F1;
    --yellow: #F9F0A8;
    --softyel: #FCF7D8;
    --cyan: #7ED6E0;
    --light-cy: #E6F6F9;
    --green: #7BC67E;
    --light-gr: #EAF7EB;
    --orange: #F4A261;
    --light-or: #FDE8D0;
    --light-pu: #E8D8F5;
    --ink: #2E2A33;
    --mute: #7A7387;
    --offwhite: #FFFDF5;
    --shadow: 0 4px 20px rgba(74, 32, 96, 0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    font-family: 'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif;
    background: linear-gradient(135deg, var(--light-pu) 0%, var(--offwhite) 60%);
    color: var(--ink);
    min-height: 100vh;
    font-size: 16.5px;       /* bumped from the implicit 16 so body text reads at 17-18 */
    -webkit-font-smoothing: antialiased;
  }
  /* Presentation layout — fill the viewport, not a slim column. */
  #app {
    max-width: 1280px;
    margin: 0 auto;
    padding: 32px 40px 64px;
  }
  @media (max-width: 720px) {
    #app { padding: 20px 16px 48px; }
  }
  header {
    display: flex;
    align-items: center;
    gap: 20px;
    background: white;
    padding: 22px 32px;
    border-radius: 22px;
    box-shadow: var(--shadow);
    margin-bottom: 28px;
    flex-wrap: wrap;
  }
  .logo-mini img {
    width: 68px;
    height: 68px;
    display: block;
  }
  .title-bar { flex: 1; min-width: 200px; }
  .title-bar h1 {
    font-size: 30px;
    color: var(--purpled);
    font-weight: 800;
    line-height: 1.1;
  }
  .title-bar .subtitle {
    font-size: 15px;
    color: var(--mute);
    margin-top: 4px;
  }
  .progress-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 180px;
  }
  .progress-label {
    font-size: 13px;
    font-weight: 700;
    color: var(--purple);
    white-space: nowrap;
  }
  .progress-bar {
    flex: 1;
    height: 10px;
    background: var(--light-pu);
    border-radius: 10px;
    overflow: hidden;
    min-width: 100px;
  }
  #progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--pink), var(--purple));
    border-radius: 10px;
    transition: width 0.4s ease;
  }
  /* Presentation-sized cards — bigger padding, slightly bigger radius,
     centred content runs long before it hits the edge. */
  .card {
    background: white;
    border-radius: 28px;
    padding: 48px 56px;
    box-shadow: var(--shadow);
    margin-bottom: 28px;
    animation: fadeIn 0.4s ease;
  }
  @media (max-width: 720px) {
    .card { padding: 28px 22px; border-radius: 22px; }
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
  h2 {
    font-size: 36px;
    color: var(--purpled);
    margin-bottom: 10px;
    font-weight: 800;
    line-height: 1.15;
  }
  h2 .num {
    display: inline-block;
    background: var(--purple);
    color: white;
    width: 44px;
    height: 44px;
    line-height: 44px;
    text-align: center;
    border-radius: 12px;
    font-size: 22px;
    margin-right: 14px;
    vertical-align: middle;
  }
  .subtitle-es {
    color: var(--purple);
    font-style: italic;
    font-size: 17px;
    margin-bottom: 28px;
  }
  p { line-height: 1.65; margin-bottom: 14px; font-size: 17px; }
  .lang-en { color: var(--ink); }
  .lang-es { color: var(--purple); font-style: italic; font-size: 15.5px; }
  .bilingual {
    padding: 14px 18px;
    background: var(--softyel);
    border-left: 4px solid var(--orange);
    border-radius: 12px;
    margin: 16px 0;
  }
  .bilingual p { margin-bottom: 4px; }
  .bilingual .lang-en { font-weight: 600; }
  .example {
    display: inline-block;
    background: var(--light-cy);
    border-radius: 10px;
    padding: 6px 12px;
    margin: 4px;
    font-weight: 600;
    color: var(--purpled);
    font-size: 15px;
  }
  .example.pink { background: var(--light-pk); }
  .example.green { background: var(--light-gr); }
  .example.yellow { background: var(--yellow); }
  .example.orange { background: var(--light-or); }
  .nav-buttons {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-top: 20px;
  }
  button.nav {
    background: white;
    color: var(--purpled);
    border: 2px solid var(--purple);
    padding: 12px 22px;
    border-radius: 16px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s ease;
    font-family: inherit;
  }
  button.nav.primary {
    background: var(--purple);
    color: white;
    border-color: var(--purple);
  }
  button.nav:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(74, 32, 96, 0.2);
  }
  button.nav:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }
  /* Clock component */
  .clock-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 20px 0;
  }
  .clock {
    width: 260px;
    height: 260px;
    position: relative;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  .clock svg { width: 100%; height: 100%; display: block; }
  .clock-face { fill: white; stroke: var(--purple); stroke-width: 4; }
  .clock-inner { fill: var(--offwhite); }
  .hour-mark { stroke: var(--purpled); stroke-width: 3; }
  .hour-num { fill: var(--purpled); font-family: inherit; font-weight: 800; font-size: 16px; }
  .hour-hand { stroke: var(--purple); stroke-width: 8; stroke-linecap: round; cursor: grab; }
  .hour-hand:active { cursor: grabbing; }
  .minute-hand { stroke: var(--pink); stroke-width: 5; stroke-linecap: round; cursor: grab; }
  .minute-hand:active { cursor: grabbing; }
  .center-dot { fill: var(--purpled); }
  .hand-label {
    text-align: center;
    font-size: 13px;
    margin-top: 4px;
    color: var(--mute);
  }
  .time-display {
    margin-top: 16px;
    text-align: center;
    background: linear-gradient(135deg, var(--purple), var(--purpled));
    color: white;
    padding: 14px 24px;
    border-radius: 16px;
    box-shadow: 0 4px 14px rgba(74, 32, 96, 0.25);
  }
  .time-display .digital {
    font-size: 36px;
    font-weight: 800;
    font-family: 'Courier New', monospace;
    letter-spacing: 2px;
  }
  .time-display .text-time {
    font-size: 18px;
    margin-top: 4px;
    font-weight: 600;
  }
  .time-display .text-es {
    font-size: 14px;
    color: var(--yellow);
    font-style: italic;
    margin-top: 2px;
  }
  /* Quiz */
  .quiz-clock {
    width: 200px;
    height: 200px;
    margin: 0 auto 16px;
    display: block;
  }
  .quiz-options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 16px;
  }
  .quiz-option {
    background: white;
    border: 3px solid var(--light-pu);
    border-radius: 14px;
    padding: 14px 12px;
    font-size: 15px;
    font-weight: 600;
    color: var(--purpled);
    cursor: pointer;
    transition: all 0.15s ease;
    font-family: inherit;
    text-align: center;
  }
  .quiz-option:hover:not(:disabled) {
    border-color: var(--purple);
    transform: translateY(-2px);
  }
  .quiz-option.correct {
    background: var(--light-gr);
    border-color: var(--green);
    color: #1e5c22;
  }
  .quiz-option.wrong {
    background: var(--light-pk);
    border-color: var(--pink);
    color: #9c2e5c;
  }
  .quiz-option:disabled { cursor: default; }
  .quiz-feedback {
    text-align: center;
    margin: 16px 0 0;
    padding: 14px;
    border-radius: 14px;
    font-weight: 700;
    font-size: 16px;
  }
  .quiz-feedback.correct { background: var(--light-gr); color: #1e5c22; }
  .quiz-feedback.wrong { background: var(--light-pk); color: #9c2e5c; }
  .quiz-score {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    background: var(--softyel);
    padding: 14px;
    border-radius: 14px;
    margin-bottom: 16px;
  }
  .score-num {
    font-size: 30px;
    font-weight: 800;
    color: var(--purpled);
  }
  .score-label {
    font-size: 13px;
    color: var(--mute);
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .stars { font-size: 24px; letter-spacing: 4px; }
  /* Match game */
  .match-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin: 20px 0;
  }
  .match-item {
    background: white;
    border: 3px solid var(--light-pu);
    border-radius: 14px;
    padding: 16px;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s ease;
    font-size: 15px;
    font-weight: 600;
    color: var(--purpled);
  }
  .match-item.selected {
    border-color: var(--purple);
    background: var(--light-pu);
    transform: scale(1.02);
  }
  .match-item.matched {
    background: var(--light-gr);
    border-color: var(--green);
    color: #1e5c22;
    cursor: default;
    opacity: 0.85;
  }
  .match-item .mini-clock {
    width: 80px;
    height: 80px;
    display: block;
    margin: 0 auto;
  }
  .rule-box {
    background: linear-gradient(135deg, var(--light-pk), var(--light-pu));
    border-radius: 20px;
    padding: 24px;
    margin: 16px 0;
    text-align: center;
  }
  .rule-box .rule-title {
    font-size: 18px;
    color: var(--purpled);
    font-weight: 800;
    margin-bottom: 12px;
  }
  .rule-box .rule-formula {
    background: white;
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 18px;
    font-weight: 700;
    color: var(--purple);
    display: inline-block;
    box-shadow: 0 3px 10px rgba(74, 32, 96, 0.1);
  }
  .rule-box .rule-es {
    font-size: 14px;
    color: var(--purple);
    font-style: italic;
    margin-top: 10px;
  }
  .visual-guide {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 24px;
    margin: 20px 0;
    flex-wrap: wrap;
  }
  .visual-half {
    text-align: center;
    padding: 16px;
    border-radius: 16px;
    min-width: 130px;
  }
  .visual-half.past { background: var(--light-cy); border: 3px solid var(--cyan); }
  .visual-half.to { background: var(--light-or); border: 3px solid var(--orange); }
  .visual-half .icon { font-size: 32px; margin-bottom: 6px; }
  .visual-half .word { font-size: 20px; font-weight: 800; color: var(--purpled); }
  .visual-half .desc { font-size: 13px; color: var(--mute); margin-top: 4px; }
  .celebration {
    text-align: center;
    padding: 30px;
  }
  .celebration .big-star {
    font-size: 80px;
    display: block;
    margin-bottom: 12px;
    animation: bounce 0.8s ease infinite alternate;
  }
  @keyframes bounce {
    from { transform: translateY(0); }
    to { transform: translateY(-8px); }
  }
  .celebration h3 {
    font-size: 32px;
    color: var(--purpled);
    margin-bottom: 10px;
  }
  .celebration p { color: var(--mute); font-size: 16px; }
  .restart-btn {
    margin-top: 24px;
    background: var(--pink);
    color: white;
    border: none;
    padding: 14px 30px;
    border-radius: 20px;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }
  .try-again-btn {
    display: block;
    margin: 12px auto 0;
    background: var(--yellow);
    color: var(--purpled);
    border: 2px solid var(--orange);
    padding: 10px 24px;
    border-radius: 14px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }
  @media (max-width: 500px) {
    header { padding: 12px 16px; }
    .title-bar h1 { font-size: 20px; }
    .card { padding: 20px; }
    h2 { font-size: 22px; }
    .clock { width: 220px; height: 220px; }
    .quiz-options { grid-template-columns: 1fr; }
    .match-grid { grid-template-columns: 1fr; }
  }

  /* Texto y correcciones */
  .reading-box {
    background: var(--offwhite);
    border: 2px solid var(--light-pu);
    border-radius: 18px;
    padding: 20px 22px;
    margin: 18px 0;
    line-height: 1.85;
    font-size: 16px;
  }
  .strike { text-decoration: line-through; text-decoration-color: var(--pink); color: #9c2e5c; }
  .fix { color: #1e5c22; background: var(--light-gr); font-weight: 700; padding: 1px 6px; border-radius: 6px; }
  .compare-block {
    background: var(--offwhite);
    border: 2px solid var(--light-pu);
    border-radius: 16px;
    padding: 16px 20px;
    margin: 14px 0;
  }
  .compare-block .label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 700;
    color: var(--mute);
    margin-bottom: 4px;
  }
  .compare-block .wrong-line { color: #9c2e5c; margin-bottom: 12px; font-size: 15px; }
  .compare-block .right-line { color: #1e5c22; font-weight: 600; font-size: 15px; }
  .final-text-box {
    background: var(--offwhite);
    border: 2px solid var(--green);
    border-radius: 18px;
    padding: 22px 24px;
    margin: 18px 0;
    line-height: 1.9;
    font-size: 16px;
  }
  .original-text-box {
    background: #FBF4F4;
    border: 2px dashed var(--pink);
    border-radius: 18px;
    padding: 18px 22px;
    margin: 18px 0;
    line-height: 1.8;
    font-size: 15px;
    color: #7a4a58;
    font-style: italic;
  }
  /* Actividad: comas */
  .comma-sentence {
    font-size: 17px;
    line-height: 2.4;
    text-align: center;
    margin: 20px 0;
  }
  .comma-token { font-weight: 600; color: var(--purpled); }
  .comma-gap {
    display: inline-block;
    min-width: 22px;
    height: 30px;
    margin: 0 2px;
    border: none;
    background: transparent;
    font-size: 22px;
    font-weight: 900;
    color: var(--light-pu);
    cursor: pointer;
    border-radius: 6px;
    vertical-align: middle;
    font-family: inherit;
  }
  .comma-gap.active { color: var(--purple); background: var(--light-pu); }
  .comma-gap.correct { background: var(--light-gr); color: #1e5c22; }
  .comma-gap.wrong { background: var(--light-pk); color: #9c2e5c; }
  .comma-gap.missing { border: 2px dashed #9c2e5c; }
  .comma-gap:disabled { cursor: default; }
  /* Actividad: unscramble */
  .unscramble-built {
    min-height: 70px;
    background: var(--light-cy);
    border: 2px solid var(--cyan);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 14px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
  }
  .unscramble-placeholder { color: var(--mute); font-style: italic; font-size: 14px; }
  .unscramble-fixed {
    font-weight: 800;
    color: var(--purpled);
    background: white;
    border-radius: 10px;
    padding: 8px 12px;
  }
  .unscramble-bank {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 14px;
    background: var(--offwhite);
    border-radius: 14px;
    min-height: 50px;
  }
  .word-chip {
    font-family: inherit;
    background: white;
    border: 2px solid var(--light-pu);
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 15px;
    font-weight: 600;
    color: var(--purpled);
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .word-chip:hover { border-color: var(--purple); }
  .word-chip.built { background: white; border-color: var(--cyan); }
  @media (max-width: 500px) {
    .comma-sentence { font-size: 15px; line-height: 2.2; }
  }
  /* IELTS band comparison */
  .band-compare {
    display: flex;
    gap: 14px;
    margin: 18px 0;
    flex-wrap: wrap;
    align-items: stretch;
  }
  .band-card {
    flex: 1;
    min-width: 190px;
    border-radius: 16px;
    padding: 18px 16px;
    text-align: center;
  }
  .band-card.original { background: #FBF4F4; border: 2px solid var(--pink); }
  .band-card.corrected { background: var(--light-gr); border: 2px solid var(--green); }
  .band-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: 700;
    color: var(--mute);
    margin-bottom: 6px;
  }
  .band-num { font-size: 32px; font-weight: 900; color: var(--purpled); margin-bottom: 8px; }
  .band-desc { font-size: 13px; color: var(--ink); line-height: 1.5; }
  .band-arrow { display: flex; align-items: center; justify-content: center; font-size: 22px; color: var(--purple); padding: 0 4px; }
  .band-note { font-size: 13px; color: var(--mute); margin-top: 10px; line-height: 1.5; }
  @media (max-width: 500px) {
    .band-arrow { transform: rotate(90deg); }
  }
  /* ===== Lesson components ===== */
  .blank { display:inline-block; min-width:60px; border-bottom:3px solid var(--pink); color:var(--pink); }
  .structure-row { display:flex; gap:12px; margin:18px 0; flex-wrap:wrap; }
  .structure-step { flex:1; min-width:150px; border-radius:16px; padding:16px; text-align:center; }
  .structure-step.s1, .tag.t1, .template-box.t1 { background: var(--light-cy); border-color: var(--cyan); }
  .structure-step.s2, .tag.t2, .template-box.t2 { background: var(--light-or); border-color: var(--orange); }
  .structure-step.s3, .tag.t3, .template-box.t3 { background: var(--light-gr); border-color: var(--green); }
  .structure-step { border:3px solid; }
  .s-num { font-size:26px; font-weight:900; color:var(--purpled); }
  .s-title { font-weight:800; color:var(--purpled); font-size:17px; }
  .s-desc { font-size:13px; color:var(--mute); margin-top:4px; }
  .vocab-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:10px 0 16px; }
  .vocab-item { background:var(--offwhite); border:2px solid var(--light-pu); border-radius:12px; padding:10px 12px; font-size:14px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; color:var(--purple); font-weight:700; }
  .v-old { color:#9c2e5c; text-decoration:line-through; text-decoration-color:var(--pink); font-weight:600; }
  .v-new { color:#1e5c22; background:var(--light-gr); padding:1px 8px; border-radius:6px; }
  .connector-table { border-radius:16px; overflow:hidden; border:2px solid var(--light-pu); margin:14px 0; }
  .ct-row { display:flex; border-bottom:2px solid var(--light-pu); }
  .ct-row:last-child { border-bottom:none; }
  .ct-row:nth-child(odd) { background: var(--offwhite); }
  .ct-fn { width:150px; flex-shrink:0; padding:12px 14px; font-weight:800; color:var(--purpled); background:var(--light-pu); font-size:14px; }
  .ct-ex { padding:12px 14px; font-size:15px; color:var(--ink); }
  .gapfill-text { background:var(--offwhite); border:2px solid var(--light-pu); border-radius:16px; padding:18px 20px; line-height:2.5; font-size:16px; }
  .gap-select { font-family:inherit; font-size:15px; font-weight:700; color:var(--purpled); background:var(--light-pu); border:2px solid var(--purple); border-radius:10px; padding:4px 8px; cursor:pointer; }
  .gap-select.correct { background:var(--light-gr); border-color:var(--green); color:#1e5c22; }
  .gap-select.wrong { background:var(--light-pk); border-color:var(--pink); color:#9c2e5c; }
  .template-box { border-left:5px solid; border-radius:14px; padding:14px 18px; margin:12px 0; }
  .t-label { font-size:12px; text-transform:uppercase; letter-spacing:1px; font-weight:800; color:var(--purpled); margin-bottom:6px; }
  .t-line { font-size:15px; line-height:1.7; color:var(--ink); }
  .t-line b { color:var(--purpled); }
  .match-cols { display:grid; grid-template-columns:1.3fr 1fr; gap:14px; margin:14px 0; }
  .match-col { display:flex; flex-direction:column; gap:10px; }
  .match-head { font-size:12px; text-transform:uppercase; letter-spacing:1px; font-weight:800; color:var(--mute); text-align:center; }
  button.match-item { font-family:inherit; text-align:left; font-size:14px; padding:12px 14px; }
  button.match-item.fn { background:var(--softyel); text-align:center; }
  button.match-item.fn.matched { background:var(--light-gr); }
  .shake { animation: shake 0.35s; border-color: var(--pink) !important; background: var(--light-pk) !important; }

  .scaffold { display:flex; gap:6px; flex-wrap:wrap; margin: 12px 0; }
  .sc-step { flex:1; min-width:150px; background: var(--offwhite); border:2px solid var(--light-pu); border-radius:14px; padding:14px 16px; font-size:14px; color: var(--ink); display:flex; gap:12px; align-items:center; }
  .sc-step span { width:28px; height:28px; border-radius:50%; background: var(--purple); color:white; font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:14px; }
  .trap-box { background: #FBF4F4; border-left:5px solid var(--pink); border-radius:12px; padding:10px 14px; font-size:14px; margin:10px 0; }
  .form-card, .notes-card { background:white; border:3px solid var(--purple); border-radius:18px; padding:24px 28px; margin: 18px 0; box-shadow: var(--shadow); font-size:16px; }
  .form-card.mini { max-width: 520px; margin: 14px auto; }
  .fc-title { font-weight:900; color: var(--purpled); letter-spacing:1px; font-size:13px; text-transform:uppercase; border-bottom:2px solid var(--light-pu); padding-bottom:8px; margin-bottom:8px; }
  .fc-row { padding:7px 0; border-bottom:1px dashed var(--light-pu); font-size:15px; line-height:2; }
  .fc-row > span:first-child { font-weight:700; color: var(--purple); display:inline-block; min-width:150px; }
  .fc-row .ex { color: var(--mute); font-size:12px; }
  .nc-h { font-weight:800; color: var(--purpled); margin-top:10px; }
  .notes-card ul { margin: 4px 0 0 20px; line-height: 2.3; font-size:15px; }
  .cf-gap { display:inline-flex; align-items:center; gap:4px; flex-wrap:wrap; }
  .cf-n { background: var(--purple); color:white; border-radius:6px; padding:0 6px; font-size:12px; }
  .cf-input { font-family:inherit; font-size:15px; padding:4px 8px; border:2px solid var(--purple); border-radius:8px; width:150px; background: var(--offwhite); }
  .cf-input.ok { border-color: var(--green); background: var(--light-gr); }
  .cf-input.bad { border-color: var(--pink); background: #FBF4F4; }
  .cf-fb { font-size:12.5px; font-weight:800; }
  .cf-fb.ok { color:#1e5c22; } .cf-fb.bad { color:#9c2e5c; }
  .map-wrap { margin: 14px auto; max-width: 460px; }
  .map { display:grid; grid-template-columns: repeat(3,1fr); gap:6px; background: var(--light-pu); border:3px solid var(--purple); border-radius:14px; padding:8px; }
  .mc { background:white; border-radius:10px; height:70px; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:22px; color: var(--purpled); }
  .mc.fixed { font-size:13px; background: var(--yellow); }
  .mc.ent { background: var(--light-gr); }
  .map-note { text-align:center; font-size:13px; color: var(--mute); margin-top:6px; }
  .transcript { margin-top:16px; }
  .tr-body { max-height:380px; overflow-y:auto; font-size:14.5px; line-height:1.7; }
  .tr-body p { margin:0 0 8px; }
  .tr-spk { color: var(--purple); }
  .tr-body mark, .tr-key mark { background: #CDEFC4; padding:0 3px; border-radius:4px; }
  .dis { background: #FAD4DD; text-decoration: line-through; text-decoration-color: #c0567a; padding:0 3px; border-radius:4px; }
  .sig { color: var(--purple); font-weight:800; font-style:normal; }
  .tr-key { font-size:12px; color: var(--mute); margin-top:6px; }
  .scaffold-plan { background: var(--offwhite); border:2px solid var(--light-pu); border-radius:16px; padding:14px 18px; margin-top:16px; }
  .sp-row { padding:6px 0; border-bottom:1px dashed var(--light-pu); font-size:14.5px; }
  .sp-row:last-child { border-bottom:none; }
  @media (max-width: 600px) { .parts-grid { grid-template-columns: 1fr 1fr; } .fc-row span { min-width: 0; } }
</style>
</head>

<script>

// STATE
// ═══════════════════════════════════════════════════════
const state = { section: 0 };

// ═══════════════════════════════════════════════════════
// QUIZ ENGINE (complete the blank / alternatives — opción múltiple)
// ═══════════════════════════════════════════════════════
function renderQuizGame(containerId, questions) {
  const container = document.getElementById(containerId);
  const gameState = { idx: 0, correct: 0, done: false };

  const render = () => {
    if (gameState.done) {
      container.innerHTML = `
        <div class="quiz-feedback correct" style="margin-top: 8px;">
          ✅ Completed: <b>${gameState.correct}/${questions.length}</b> correct
        </div>
        <button class="try-again-btn" id="${containerId}-retry">🔄 Try again</button>
      `;
      document.getElementById(containerId + '-retry').addEventListener('click', retry);
      return;
    }
    const q = questions[gameState.idx];
    container.innerHTML = `
      <div style="margin-bottom: 12px; font-size: 13px; color: var(--mute);">Question ${gameState.idx + 1} of ${questions.length}</div>
      <div style="text-align:center; font-size: 16px; font-weight: 700; color: var(--purpled); margin-bottom: 14px;">${q.prompt}</div>
      <div class="quiz-options">
        ${q.options.map((opt, i) => `<button class="quiz-option" data-i="${i}">${opt}</button>`).join('')}
      </div>
      <div id="${containerId}-fb"></div>
    `;
    container.querySelectorAll('.quiz-option').forEach(btn => {
      btn.addEventListener('click', () => handleAnswer(parseInt(btn.dataset.i)));
    });
  };

  const retry = () => {
    gameState.idx = 0;
    gameState.correct = 0;
    gameState.done = false;
    render();
  };

  const handleAnswer = (i) => {
    const q = questions[gameState.idx];
    const options = container.querySelectorAll('.quiz-option');
    const fb = document.getElementById(`${containerId}-fb`);
    options.forEach(o => o.disabled = true);
    if (i === q.correct) {
      options[i].classList.add('correct');
      gameState.correct++;
      fb.innerHTML = '<div class="quiz-feedback correct">✅ Correct!' + (q.note ? ' ' + q.note : '') + '</div>';
    } else {
      options[i].classList.add('wrong');
      options[q.correct].classList.add('correct');
      fb.innerHTML = '<div class="quiz-feedback wrong">The correct answer was: <b>' + q.options[q.correct] + '</b>' + (q.note ? '. ' + q.note : '') + '</div>';
    }
    setTimeout(() => {
      gameState.idx++;
      if (gameState.idx >= questions.length) gameState.done = true;
      render();
    }, 1800);
  };

  render();
}

// ═══════════════════════════════════════════════════════
// ACTIVIDAD: Apply commas (click para colocar comas)
// ═══════════════════════════════════════════════════════
function renderCommaActivity(containerId, tokens, correctPositionsArr) {
  const container = document.getElementById(containerId);
  const correctPositions = new Set(correctPositionsArr);
  const st = { placed: new Set(), checked: false };

  const gapClass = (i) => {
    let cls = 'comma-gap';
    if (st.placed.has(i)) cls += ' active';
    if (st.checked) {
      const shouldHave = correctPositions.has(i);
      const has = st.placed.has(i);
      if (shouldHave && has) cls += ' correct';
      else if (shouldHave && !has) cls += ' missing';
      else if (!shouldHave && has) cls += ' wrong';
    }
    return cls;
  };

  const render = () => {
    let fbHtml = '';
    if (st.checked) {
      const correctCount = [...correctPositions].filter(i => st.placed.has(i)).length;
      const extraCount = [...st.placed].filter(i => !correctPositions.has(i)).length;
      if (correctCount === correctPositions.size && extraCount === 0) {
        fbHtml = '<span style="color:#1e5c22;">✅ Perfect! The commas are in the right place.</span>';
      } else {
        fbHtml = `<span style="color:#9c2e5c;">Check the marked commas — correct: ${correctCount}/${correctPositions.size}. (Red = not needed, dotted border = missing)</span>`;
      }
    }
    container.innerHTML = `
      <div class="comma-sentence">
        ${tokens.map((t, i) => `<span class="comma-token">${t}</span>` + (i < tokens.length - 1 ? `<button class="${gapClass(i)}" data-idx="${i}" ${st.checked ? 'disabled' : ''}>${st.placed.has(i) ? ',' : '·'}</button>` : '')).join('')}
      </div>
      <div style="text-align:center; margin-top:16px;">
        ${!st.checked ? `<button class="try-again-btn" id="${containerId}-check">Check</button>` : `<button class="try-again-btn" id="${containerId}-retry">🔄 Try again</button>`}
      </div>
      <div style="text-align:center; margin-top:10px; font-weight:700;">${fbHtml}</div>
    `;
    container.querySelectorAll('.comma-gap').forEach(btn => {
      btn.addEventListener('click', () => {
        if (st.checked) return;
        const idx = parseInt(btn.dataset.idx);
        if (st.placed.has(idx)) st.placed.delete(idx); else st.placed.add(idx);
        render();
      });
    });
    if (!st.checked) {
      const checkBtn = document.getElementById(containerId + '-check');
      if (checkBtn) checkBtn.addEventListener('click', () => { st.checked = true; render(); });
    } else {
      const retryBtn = document.getElementById(containerId + '-retry');
      if (retryBtn) retryBtn.addEventListener('click', () => { st.placed = new Set(); st.checked = false; render(); });
    }
  };

  render();
}

// ═══════════════════════════════════════════════════════
// ACTIVIDAD: Unscramble the words
// ═══════════════════════════════════════════════════════
function renderUnscramble(containerId, correctTokens, fixedStart) {
  const container = document.getElementById(containerId);
  const shuffle = (arr) => arr.map(v => [Math.random(), v]).sort((a, b) => a[0] - b[0]).map(v => v[1]);
  const bank0 = shuffle(correctTokens.map((t, i) => ({ t, id: i })));
  const st = { bank: [...bank0], built: [], checked: false, correct: false };

  const render = () => {
    const fbHtml = st.checked
      ? (st.correct
          ? '<span style="color:#1e5c22;">✅ Excellent! That is the correct sentence.</span>'
          : '<span style="color:#9c2e5c;">Not quite right yet — try again.</span>')
      : '';
    container.innerHTML = `
      <div class="unscramble-built">
        ${fixedStart ? `<span class="unscramble-fixed">${fixedStart}</span>` : ''}
        ${st.built.length === 0 ? '<span class="unscramble-placeholder">Tap the words in order…</span>' : st.built.map(b => `<button class="word-chip built" data-id="${b.id}">${b.t}</button>`).join(' ')}
      </div>
      <div class="unscramble-bank">
        ${st.bank.map(b => `<button class="word-chip" data-id="${b.id}">${b.t}</button>`).join(' ')}
      </div>
      <div style="text-align:center; margin-top:14px;">
        ${!st.checked ? `<button class="try-again-btn" id="${containerId}-check" ${st.bank.length > 0 ? 'disabled' : ''}>Check</button>` : `<button class="try-again-btn" id="${containerId}-retry">🔄 Try again</button>`}
      </div>
      <div style="text-align:center; margin-top:10px; font-weight:700;">${fbHtml}</div>
    `;
    if (!st.checked) {
      container.querySelectorAll('.unscramble-bank .word-chip').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = parseInt(btn.dataset.id);
          const item = st.bank.find(b => b.id === id);
          st.bank = st.bank.filter(b => b.id !== id);
          st.built.push(item);
          render();
        });
      });
      container.querySelectorAll('.unscramble-built .word-chip').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = parseInt(btn.dataset.id);
          const item = st.built.find(b => b.id === id);
          st.built = st.built.filter(b => b.id !== id);
          st.bank.push(item);
          render();
        });
      });
      const checkBtn = document.getElementById(containerId + '-check');
      if (checkBtn) checkBtn.addEventListener('click', () => {
        st.checked = true;
        st.correct = st.built.length === correctTokens.length && st.built.every((b, i) => b.t === correctTokens[i]);
        render();
      });
    } else {
      const retryBtn = document.getElementById(containerId + '-retry');
      if (retryBtn) retryBtn.addEventListener('click', () => {
        st.bank = shuffle(bank0);
        st.built = [];
        st.checked = false;
        st.correct = false;
        render();
      });
    }
  };

  render();
}

// ═══════════════════════════════════════════════════════
// ACTIVITY: Gap fill with dropdowns
// ═══════════════════════════════════════════════════════
function renderGapFill(containerId, parts) {
  const container = document.getElementById(containerId);
  const shuffle = (arr) => arr.map(v => [Math.random(), v]).sort((a, b) => a[0] - b[0]).map(v => v[1]);
  const gaps = parts.filter(p => typeof p !== 'string');
  const shuffled = gaps.map(g => g.keepOrder ? [...g.options].sort() : shuffle(g.options));
  const st = { checked: false, values: gaps.map(() => '') };

  const render = () => {
    let gi = 0;
    const html = parts.map(p => {
      if (typeof p === 'string') return `<span>${p}</span>`;
      const i = gi++;
      let cls = 'gap-select';
      if (st.checked) cls += st.values[i] === p.options[0] ? ' correct' : ' wrong';
      return `<select class="${cls}" data-i="${i}" ${st.checked ? 'disabled' : ''}>
        <option value="">— choose —</option>
        ${shuffled[i].map(o => `<option value="${o}" ${st.values[i] === o ? 'selected' : ''}>${o}</option>`).join('')}
      </select>`;
    }).join(' ');
    let fb = '';
    if (st.checked) {
      const ok = gaps.filter((g, i) => st.values[i] === g.options[0]).length;
      fb = ok === gaps.length
        ? '<span style="color:#1e5c22;">✅ Perfect! All the answers are correct.</span>'
        : `<span style="color:#9c2e5c;">Correct: ${ok}/${gaps.length}. The right answers were: ${gaps.map(g => '<b>' + g.options[0] + '</b>').join(' · ')}</span>`;
    }
    container.innerHTML = `
      <div class="gapfill-text">${html}</div>
      <div style="text-align:center; margin-top:14px;">
        ${!st.checked ? `<button class="try-again-btn" id="${containerId}-check">Check</button>` : `<button class="try-again-btn" id="${containerId}-retry">🔄 Try again</button>`}
      </div>
      <div style="text-align:center; margin-top:10px; font-weight:700; line-height:1.6;">${fb}</div>
    `;
    container.querySelectorAll('.gap-select').forEach(sel => {
      sel.addEventListener('change', () => { st.values[parseInt(sel.dataset.i)] = sel.value; });
    });
    if (!st.checked) {
      document.getElementById(containerId + '-check').addEventListener('click', () => { st.checked = true; render(); });
    } else {
      document.getElementById(containerId + '-retry').addEventListener('click', () => { st.checked = false; st.values = gaps.map(() => ''); render(); });
    }
  };
  render();
}

// ACTIVITY: Match (phrase ↔ function)
// ═══════════════════════════════════════════════════════
function renderMatch(containerId, pairs) {
  const container = document.getElementById(containerId);
  const shuffle = (arr) => arr.map(v => [Math.random(), v]).sort((a, b) => a[0] - b[0]).map(v => v[1]);
  let st;
  const reset = () => {
    st = {
      left: shuffle(pairs.map((p, i) => ({ t: p[0], id: i }))),
      right: shuffle(pairs.map((p, i) => ({ t: p[1], id: i }))),
      selL: null, selR: null, matched: new Set(), errors: 0, flash: null
    };
  };
  reset();

  const tryMatch = () => {
    if (st.selL === null || st.selR === null) return;
    if (st.selL === st.selR) {
      st.matched.add(st.selL);
      st.flash = null;
    } else {
      st.errors++;
      st.flash = [st.selL, st.selR];
      setTimeout(() => { st.flash = null; render(); }, 700);
    }
    st.selL = null; st.selR = null;
  };

  const render = () => {
    const done = st.matched.size === pairs.length;
    container.innerHTML = `
      <div class="match-cols">
        <div class="match-col">
          <div class="match-head">Phrase</div>
          ${st.left.map(l => `<button class="match-item ${st.matched.has(l.id) ? 'matched' : ''} ${st.selL === l.id ? 'selected' : ''} ${st.flash && st.flash[0] === l.id ? 'shake' : ''}" data-side="L" data-id="${l.id}" ${st.matched.has(l.id) ? 'disabled' : ''}>${l.t}</button>`).join('')}
        </div>
        <div class="match-col">
          <div class="match-head">Function</div>
          ${st.right.map(r => `<button class="match-item fn ${st.matched.has(r.id) ? 'matched' : ''} ${st.selR === r.id ? 'selected' : ''} ${st.flash && st.flash[1] === r.id ? 'shake' : ''}" data-side="R" data-id="${r.id}" ${st.matched.has(r.id) ? 'disabled' : ''}>${r.t}</button>`).join('')}
        </div>
      </div>
      ${done ? `<div class="quiz-feedback correct">✅ All matched! Mistakes: ${st.errors}</div><button class="try-again-btn" id="${containerId}-retry">🔄 Try again</button>` : '<p style="text-align:center; color: var(--mute); font-size: 13px;">Tap a phrase, then its function</p>'}
    `;
    container.querySelectorAll('.match-item').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = parseInt(btn.dataset.id);
        if (btn.dataset.side === 'L') st.selL = id; else st.selR = id;
        tryMatch();
        render();
      });
    });
    if (done) document.getElementById(containerId + '-retry').addEventListener('click', () => { reset(); render(); });
  };
  render();
}

function renderCapitals(containerId, tokens) {
  const container = document.getElementById(containerId);
  const st = { on: new Set(), checked: false };
  const cap = w => w.charAt(0).toUpperCase() + w.slice(1);
  const render = () => {
    let fb = '';
    if (st.checked) {
      const need = tokens.map((t, i) => t[1] ? i : -1).filter(i => i >= 0);
      const ok = need.filter(i => st.on.has(i)).length;
      const extra = [...st.on].filter(i => !tokens[i][1]).length;
      fb = ok === need.length && extra === 0
        ? '<span style="color:#1e5c22;">✅ Perfect! Every capital letter is in the right place.</span>'
        : `<span style="color:#9c2e5c;">Correct: ${ok}/${need.length}. (Red = no capital needed, dotted border = missing capital)</span>`;
    }
    container.innerHTML = `
      <div class="cap-sentence">
        ${tokens.map((t, i) => {
          let cls = 'cap-word';
          if (st.on.has(i)) cls += ' active';
          if (st.checked) {
            if (t[1] && st.on.has(i)) cls += ' correct';
            else if (t[1]) cls += ' missing';
            else if (st.on.has(i)) cls += ' wrong';
          }
          return `<button class="${cls}" data-i="${i}" ${st.checked ? 'disabled' : ''}>${st.on.has(i) ? cap(t[0]) : t[0]}</button>`;
        }).join(' ')}
      </div>
      <div style="text-align:center; margin-top:14px;">
        ${!st.checked ? `<button class="try-again-btn" id="${containerId}-check">Check</button>` : `<button class="try-again-btn" id="${containerId}-retry">🔄 Try again</button>`}
      </div>
      <div style="text-align:center; margin-top:10px; font-weight:700;">${fb}</div>`;
    container.querySelectorAll('.cap-word').forEach(b => b.addEventListener('click', () => {
      const i = parseInt(b.dataset.i); st.on.has(i) ? st.on.delete(i) : st.on.add(i); render();
    }));
    if (!st.checked) document.getElementById(containerId + '-check').onclick = () => { st.checked = true; render(); };
    else document.getElementById(containerId + '-retry').onclick = () => { st.on = new Set(); st.checked = false; render(); };
  };
  render();
}

const L = {

const timers = {};
function renderTimerWidget(containerId, minutes) {
  const el = document.getElementById(containerId);
  if (!timers[containerId]) timers[containerId] = { left: minutes * 60, running: false, h: null };
  const t = timers[containerId];
  const draw = () => {
    if (!document.getElementById(containerId)) { clearInterval(t.h); t.running = false; return; }
    const m = String(Math.floor(t.left / 60)).padStart(2, '0'), s = String(t.left % 60).padStart(2, '0');
    el.innerHTML = `<div class="timer-inline">
      <div class="timer-clock ${t.left <= 30 ? 'warn' : ''}">⏱️ ${m}:${s}</div>
      <button class="timer-btn" id="${containerId}-go">${t.running ? '⏸ Pause' : (t.left === minutes * 60 ? `▶ Start ${minutes}-min timer` : '▶ Resume')}</button>
      <button class="timer-btn ghost" id="${containerId}-rs">↺ Reset</button>
      ${t.left === 0 ? '<span style="font-weight:800; color:#9c2e5c;">⏰ Time is up!</span>' : ''}
    </div>`;
    document.getElementById(containerId + '-go').onclick = () => {
      if (t.running) { clearInterval(t.h); t.running = false; }
      else { t.running = true; t.h = setInterval(() => { t.left = Math.max(0, t.left - 1); if (t.left === 0) { clearInterval(t.h); t.running = false; } draw(); }, 1000); }
      draw();
    };
    document.getElementById(containerId + '-rs').onclick = () => { clearInterval(t.h); t.running = false; t.left = minutes * 60; draw(); };
  };
  draw();
}

// ═══════════════════════════════════════════════════════
//
// Audios are generated once at build time via
//   node scripts/bake-ielts-lesson.js listening-intro
// → ElevenLabs TTS, uploaded to Firebase Storage, URLs injected into
// PREBAKED_AUDIOS below. The audio element replaces the sentence-by-
// sentence SpeechSynthesis queue: one <audio> tag per part, with speed
// + exam-mode controls preserved.
const PREBAKED_AUDIOS = {
  "test": "https://storage.googleapis.com/friendly-scheduling.firebasestorage.app/audio/ielts-lessons/listening-intro/test.mp3",
  "part-1": "https://storage.googleapis.com/friendly-scheduling.firebasestorage.app/audio/ielts-lessons/listening-intro/part-1.mp3",

  "part-4": "https://storage.googleapis.com/friendly-scheduling.firebasestorage.app/audio/ielts-lessons/listening-intro/part-4.mp3"
};
const TTS = window.speechSynthesis || null;
const AUDIO = { rate: 0.8, voices: [], playing: null };
function loadVoices() {
  if (!TTS) return;
  const all = TTS.getVoices().filter(v => /^en/i.test(v.lang));
  const pref = l => all.filter(v => v.lang.replace('_', '-').toLowerCase().startsWith(l));
  AUDIO.voices = [...pref('en-gb'), ...pref('en-au'), ...pref('en-us'), ...all].filter((v, i, a) => a.indexOf(v) === i);
}
if (TTS) { loadVoices(); TTS.onvoiceschanged = loadVoices; }
const FEMALE = /female|samantha|serena|kate|libby|sonia|hazel|susan|karen|moira|tessa|fiona|victoria|zira|aria|jenny|natasha|clara/i;
const MALE = /male|daniel|arthur|george|ryan|oliver|thomas|alex|fred|david|mark|guy|william|lee|james/i;
function pickVoice(g, idx) {
  const vs = AUDIO.voices; if (!vs.length) return null;
  const f = vs.filter(v => FEMALE.test(v.name) && !/\bmale\b/i.test(v.name.replace(/female/i, '')));
  const m = vs.filter(v => MALE.test(v.name) && !FEMALE.test(v.name));
  const pool = g === 'f' ? (f.length ? f : vs) : (m.length ? m : vs);
  return pool[idx % pool.length];
}
const sentences = t => t.match(/[^.!?]+[.!?]*["”]?/g) || [t];
function stopAudio() { if (TTS) TTS.cancel(); if (AUDIO.playing) { AUDIO.playing.stop = true; AUDIO.playing = null; } document.querySelectorAll('.au-play').forEach(b => b.classList.remove('on')); }

// Player for a script. Pre-baked MP3 (PREBAKED_AUDIOS[cacheKey]) wins
// over browser TTS — we fall through only when no mirror is defined,
// which keeps the lesson playable before audios are baked.
const playerState = {};
function renderPlayer(containerId, script, cacheKey, opts = {}) {
  const box = document.getElementById(containerId);
  const st = playerState[containerId] || (playerState[containerId] = { plays: 0, examMode: false });
  const prebakedUrl = PREBAKED_AUDIOS && cacheKey ? PREBAKED_AUDIOS[cacheKey] : null;

  // ── Prebaked MP3 path — one <audio> element, speed via playbackRate.
  if (prebakedUrl) {
    const drawBaked = () => {
      const locked = st.examMode && st.plays >= 1;
      box.innerHTML = `
        <div class="au-box">
          <button class="au-play" id="${containerId}-play" ${locked ? 'disabled' : ''}>${locked ? '🔒 Played once' : '▶ Play'}</button>
          <button class="au-stop" id="${containerId}-stop">⏹ Stop</button>
          <div class="au-speed">
            ${[[0.7, '🐢 Slow'], [0.85, '🚶 Steady'], [1, '🎧 Exam speed']].map(([r, l]) => `<button class="au-sp ${AUDIO.rate === r ? 'on' : ''}" data-r="${r}">${l}</button>`).join('')}
          </div>
          <label class="au-exam"><input type="checkbox" id="${containerId}-exam" ${st.examMode ? 'checked' : ''}> Exam mode (play once)</label>
          <audio class="au-el-tag" id="${containerId}-el" src="${prebakedUrl}" preload="metadata" controls></audio>
          <div class="au-info" id="${containerId}-info">Studio MP3 · plays: ${st.plays}</div>
        </div>`;
      const audio = document.getElementById(containerId + '-el');
      if (audio) audio.playbackRate = AUDIO.rate;
      box.querySelectorAll('.au-sp').forEach(b => b.onclick = () => {
        AUDIO.rate = parseFloat(b.dataset.r);
        document.querySelectorAll('.au-sp').forEach(x => x.classList.toggle('on', parseFloat(x.dataset.r) === AUDIO.rate));
        if (audio) audio.playbackRate = AUDIO.rate;
      });
      document.getElementById(containerId + '-exam').onchange = e => { st.examMode = e.target.checked; drawBaked(); };
      document.getElementById(containerId + '-stop').onclick = () => {
        if (audio) { audio.pause(); audio.currentTime = 0; }
        document.querySelectorAll('.au-play').forEach(b => b.classList.remove('on'));
      };
      document.getElementById(containerId + '-play').onclick = () => {
        if (!audio) return;
        stopAudio();
        audio.playbackRate = AUDIO.rate;
        audio.currentTime = 0;
        audio.play();
        st.plays++;
        document.getElementById(containerId + '-info').textContent = `Studio MP3 · plays: ${st.plays}`;
        const btn = document.getElementById(containerId + '-play'); if (btn) btn.classList.add('on');
      };
      if (audio) audio.onended = () => {
        const b = document.getElementById(containerId + '-play'); if (b) b.classList.remove('on');
        if (st.examMode && st.plays >= 1) drawBaked(); // re-render to lock
      };
    };
    drawBaked();
    return;
  }

  // ── Fallback — browser TTS (unchanged).
  const draw = () => {
    if (!TTS) { box.innerHTML = '<div class="au-warn">⚠️ Audio is not available in this browser. Open the file in Chrome, Edge or Safari — or your teacher can read the transcript aloud.</div>'; return; }
    const locked = st.examMode && st.plays >= 1;
    box.innerHTML = `
      <div class="au-box">
        <button class="au-play" id="${containerId}-play" ${locked ? 'disabled' : ''}>${locked ? '🔒 Played once' : '▶ Play'}</button>
        <button class="au-stop" id="${containerId}-stop">⏹ Stop</button>
        <div class="au-speed">
          ${[[0.7, '🐢 Slow'], [0.85, '🚶 Steady'], [1, '🎧 Exam speed']].map(([r, l]) => `<button class="au-sp ${AUDIO.rate === r ? 'on' : ''}" data-r="${r}">${l}</button>`).join('')}
        </div>
        <label class="au-exam"><input type="checkbox" id="${containerId}-exam" ${st.examMode ? 'checked' : ''}> Exam mode (play once)</label>
        <div class="au-prog"><div class="au-bar" id="${containerId}-bar"></div></div>
        <div class="au-info" id="${containerId}-info">Plays: ${st.plays}</div>
      </div>`;
    box.querySelectorAll('.au-sp').forEach(b => b.onclick = () => { AUDIO.rate = parseFloat(b.dataset.r); document.querySelectorAll('.au-sp').forEach(x => x.classList.toggle('on', parseFloat(x.dataset.r) === AUDIO.rate)); });
    document.getElementById(containerId + '-exam').onchange = e => { st.examMode = e.target.checked; draw(); };
    document.getElementById(containerId + '-stop').onclick = stopAudio;
    document.getElementById(containerId + '-play').onclick = () => {
      stopAudio(); loadVoices();
      st.plays++; draw();
      const btn = document.getElementById(containerId + '-play'); if (btn) btn.classList.add('on');
      const queue = [];
      script.forEach((line, li) => sentences(line.t).forEach(s => queue.push({ line, li, s: s.trim() })));
      const run = { stop: false }; AUDIO.playing = run;
      let i = 0;
      const next = () => {
        if (run.stop) return;
        const bar = document.getElementById(containerId + '-bar');
        if (i >= queue.length) { if (bar) bar.style.width = '100%'; const b = document.getElementById(containerId + '-play'); if (b) b.classList.remove('on'); AUDIO.playing = null; return; }
        const q = queue[i++];
        if (bar) bar.style.width = Math.round(i * 100 / queue.length) + '%';
        const u = new SpeechSynthesisUtterance(q.s);
        const v = pickVoice(q.line.g, q.line.v || 0);
        if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'en-GB';
        u.rate = AUDIO.rate; u.pitch = q.line.g === 'f' ? 1.12 : 0.85;
        const gap = (queue[i] && queue[i].li !== q.li) ? 450 : 120;
        u.onend = () => setTimeout(next, gap);
        u.onerror = () => setTimeout(next, gap);
        TTS.speak(u);
      };
      next();
    };
  };
  draw();
}

// Transcript with highlighted answers (<mark>) and distractors (<s class="dis">)
function transcriptHTML(script, title) {
  return `<details class="fold transcript"><summary>📜 ${title || 'Transcript'} — open after checking your answers</summary>
    <div class="tr-body">${script.map(l => `<p><b class="tr-spk">${l.s}:</b> ${l.h || l.t}</p>`).join('')}</div>
    <div class="tr-key"><mark>answer</mark> · <span class="dis">distractor (trap)</span></div></details>`;
}

// Dictation (one audio button per item)
function renderDictation(containerId, items) {
  const box = document.getElementById(containerId);
  const norm = s => s.toLowerCase().replace(/[£$€.,:;!?'"\s\-()]/g, '').replace(/(st|nd|rd|th)(?=[a-z])/g, '');
  const st = { vals: items.map(() => ''), checked: false };
  const render = () => {
    const res = items.map((it, i) => it.answers.map(norm).includes(norm(st.vals[i])));
    box.innerHTML = items.map((it, i) => `
      <div class="sa-row ${st.checked ? (res[i] ? 'ok' : 'bad') : ''}">
        <div class="dict-row">
          <button class="au-mini" data-i="${i}">🔊</button>
          <div class="sa-q"><b>${i + 1}.</b> ${it.label}</div>
        </div>
        <input class="sa-input" data-i="${i}" value="${st.vals[i].replace(/"/g, '&quot;')}" ${st.checked ? 'disabled' : ''} placeholder="${it.ph || 'Write what you hear'}">
        ${st.checked ? `<div class="sa-fb">${res[i] ? '✅ Correct' : `❌ Answer: <b>${it.answers[0]}</b>`}${it.note ? ` · 💡 ${it.note}` : ''}</div>` : ''}
      </div>`).join('') + `
      <div style="text-align:center; margin-top:12px;">
        ${!st.checked ? `<button class="try-again-btn" id="${containerId}-ck">Check</button>` : `<div class="quiz-score">Score: <b>${res.filter(Boolean).length}/${items.length}</b></div><button class="try-again-btn" id="${containerId}-rt">🔄 Try again</button>`}
      </div>`;
    box.querySelectorAll('.au-mini').forEach(b => b.onclick = () => {
      if (!TTS) return; stopAudio(); loadVoices();
      const it = items[b.dataset.i];
      const u = new SpeechSynthesisUtterance(it.say);
      const v = pickVoice(b.dataset.i % 2 ? 'm' : 'f', 0); if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'en-GB';
      u.rate = Math.min(AUDIO.rate, 0.85); TTS.speak(u);
    });
    box.querySelectorAll('.sa-input').forEach(inp => inp.addEventListener('input', () => { st.vals[inp.dataset.i] = inp.value; }));
    if (!st.checked) document.getElementById(containerId + '-ck').onclick = () => { st.checked = true; render(); };
    else document.getElementById(containerId + '-rt').onclick = () => { st.checked = false; st.vals = items.map(() => ''); render(); };
  };
  render();
}

// Form / note completion (typed, checked against variants)
function renderCompletion(containerId, layoutHTML, answers, maxWords) {
  const box = document.getElementById(containerId);
  const norm = s => s.toLowerCase().replace(/[£$€.,:;!?'"()]/g, '').replace(/\s+/g, ' ').trim();
  const tight = s => norm(s).replace(/[\s\-]/g, '').replace(/(\d)(st|nd|rd|th)/g, '$1').replace(/of/g, '');
  const st = { vals: {}, checked: false };
  const render = () => {
    let html = layoutHTML;
    let ok = 0;
    Object.keys(answers).forEach(n => {
      const v = st.vals[n] || '';
      const good = answers[n].some(a => norm(a) === norm(v) || tight(a) === tight(v));
      const over = v.trim().split(/\s+/).filter(Boolean).length > maxWords;
      if (good && !over) ok++;
      const fb = st.checked ? `<span class="cf-fb ${good && !over ? 'ok' : 'bad'}">${good && !over ? '✓' : '✗ ' + answers[n][0]}${over ? ' (too many words)' : ''}</span>` : '';
      html = html.replace(`{${n}}`, `<span class="cf-gap"><b class="cf-n">${n}</b><input class="cf-input ${st.checked ? (good && !over ? 'ok' : 'bad') : ''}" data-n="${n}" value="${v.replace(/"/g, '&quot;')}" ${st.checked ? 'disabled' : ''}>${fb}</span>`);
    });
    const total = Object.keys(answers).length;
    box.innerHTML = html + `
      <div style="text-align:center; margin-top:14px;">
        ${!st.checked ? `<button class="try-again-btn" id="${containerId}-ck">Check</button>` : `<div class="quiz-score">Score: <b>${ok}/${total}</b></div><button class="try-again-btn" id="${containerId}-rt">🔄 Try again</button>`}
      </div>`;
    box.querySelectorAll('.cf-input').forEach(inp => inp.addEventListener('input', () => { st.vals[inp.dataset.n] = inp.value; }));
    if (!st.checked) document.getElementById(containerId + '-ck').onclick = () => { st.checked = true; render(); };
    else document.getElementById(containerId + '-rt').onclick = () => { st.checked = false; st.vals = {}; render(); };
  };
  render();
}

// ═══════════════════════════════════════════════════════
// NAVEGACIÓN
// ═══════════════════════════════════════════════════════
function renderSection() {
  const content = document.getElementById('content');
  content.innerHTML = sections[state.section].render();
  sections[state.section].onMount();
  document.getElementById('prev-btn').disabled = state.section === 0;
  const nextBtn = document.getElementById('next-btn');
  if (state.section === sections.length - 1) {
    nextBtn.style.display = 'none';
  } else {
    nextBtn.style.display = '';
    nextBtn.textContent = state.section === 0 ? 'Start →' : 'Next →';
  }
  const pct = Math.round((state.section + 1) * 100 / sections.length);
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('prog-current').textContent = state.section + 1;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

document.getElementById('next-btn').addEventListener('click', () => {
  if (state.section < sections.length - 1) {
    state.section++;
    renderSection();
  }
});
document.getElementById('prev-btn').addEventListener('click', () => {
  if (state.section > 0) {
    state.section--;
    renderSection();
  }
});

renderSection();
