<!DOCTYPE html>

<body>
<div id="app">
  <header>
    <div class="badge-logo">50m</div>
    <div class="title-bar">
      <h1>TOEFL iBT · 1:1 Quick Refresh &amp; Audio</h1>
      <div class="subtitle">50-Min Pacing · ElevenLabs API + Fallback · 2x Drills</div>
    </div>
    <div class="progress-wrap">
      <div class="progress-label"><span id="prog-current">1</span>/<span id="prog-total">6</span></div>
      <div class="progress-bar"><div id="progress-fill" style="width:16%"></div></div>
    </div>
  </header>
  <main id="content"></main>
  <div class="nav-buttons">
    <button class="nav" id="prev-btn">← Back</button>
    <button class="nav primary" id="next-btn">Next →</button>
  </div>
</div>

<script>
const state = {
  section: 0,
  elApiKey: "",
  elVoiceId: "JBFqnCBsd6RMkjVDRZzb"
};
const labDrafts = {};
const timers = {};
const audioCache = {};
const PREBAKED_AUDIOS = {
  "drill-a": "https://storage.googleapis.com/friendly-scheduling.firebasestorage.app/audio/toefl-lessons/refresh-50min/drill-a.mp3",
  "drill-b": "https://storage.googleapis.com/friendly-scheduling.firebasestorage.app/audio/toefl-lessons/refresh-50min/drill-b.mp3"
};



function stopAllAudio() {
  try {
    if ("speechSynthesis" in window) {
      window.speechSynthesis.cancel();
    }
  } catch (e) {}
  document.querySelectorAll("audio").forEach(el => {
    try { el.pause(); } catch (e) {}
  });
}

async function generateElevenLabsAudio(cacheKey, spokenText) {
  // Pre-baked override: if the batch script has uploaded an MP3 for
  // this cacheKey, use the Firebase Storage URL directly — no API
  // key, no browser-TTS fallback. Overrides anything else.
  if (PREBAKED_AUDIOS && PREBAKED_AUDIOS[cacheKey]) {
    return PREBAKED_AUDIOS[cacheKey];
  }

  const apiKey = (state.elApiKey || "").trim();
  const voiceId = (state.elVoiceId || "JBFqnCBsd6RMkjVDRZzb").trim();
  if (!apiKey) {
    throw new Error("NO_API_KEY");
  }
  const fullCacheKey = `${voiceId}::${cacheKey}`;
  if (audioCache[fullCacheKey]) {
    return audioCache[fullCacheKey];
  }
  const endpoint = `https://api.elevenlabs.io/v1/text-to-speech/${encodeURIComponent(voiceId)}?output_format=mp3_44100_128`;
  const resp = await fetch(endpoint, {
    method: "POST",
    headers: {
      "xi-api-key": apiKey,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      text: spokenText,
      model_id: "eleven_multilingual_v2"
    })
  });
  if (!resp.ok) {
    throw new Error(`ElevenLabs HTTP ${resp.status}`);
  }
  const blob = await resp.blob();
  const url = URL.createObjectURL(blob);
  audioCache[fullCacheKey] = url;
  return url;
}

function renderAudioPlayer(containerId, cacheKey, spokenText, transcriptHtml, labelText) {
  const container = document.getElementById(containerId);
  if (!container) return;
  const st = { statusText: "Listo. Audios pre-cargados — toca ▶ para reproducir.", showScript: false, audioUrl: "" };

  const draw = () => {
    const hasKey = Boolean((state.elApiKey || "").trim());
    const hasSpeech = "speechSynthesis" in window && typeof SpeechSynthesisUtterance !== "undefined";
    container.innerHTML = `
      <div class="audio-player">
        <div style="font-weight:800; color:var(--purpled); font-size:14px; margin-bottom:8px;">
          🎧 ${labelText} · ${hasKey ? "Mode: ElevenLabs API" : "Mode: Browser TTS Fallback"}
        </div>
        <div class="audio-controls">
          <button class="audio-btn" id="${containerId}-play">▶ Play Audio</button>
          <button class="audio-btn sec" id="${containerId}-stop">⏹ Stop</button>
          <button class="audio-btn sec" id="${containerId}-script">${st.showScript ? "🙈 Hide Transcript" : "📄 Show Transcript"}</button>
          <span class="audio-status" id="${containerId}-st">${st.statusText}</span>
        </div>
        ${st.audioUrl ? `<audio class="audio-el-tag" id="${containerId}-el" controls src="${st.audioUrl}" autoplay></audio>` : ""}
        ${st.showScript ? `<div class="transcript-box">${transcriptHtml}</div>` : ""}
      </div>
    `;

    const playBtn = document.getElementById(containerId + "-play");
    const stopBtn = document.getElementById(containerId + "-stop");
    const scriptBtn = document.getElementById(containerId + "-script");

    if (playBtn) {
      playBtn.addEventListener("click", async () => {
        stopAllAudio();
        if ((state.elApiKey || "").trim()) {
          st.statusText = "Generating audio with ElevenLabs...";
          draw();
          try {
            const url = await generateElevenLabsAudio(cacheKey, spokenText);
            st.audioUrl = url;
            st.statusText = "Playing ElevenLabs MP3.";
            draw();
          } catch (err) {
            st.audioUrl = "";
            if (hasSpeech) {
              st.statusText = "ElevenLabs request failed—using browser speech fallback.";
              draw();
              const utter = new SpeechSynthesisUtterance(spokenText);
              utter.lang = "en-US";
              utter.rate = 0.98;
              window.speechSynthesis.speak(utter);
            } else {
              st.statusText = "Could not load audio—open transcript.";
              draw();
            }
          }
        } else if (hasSpeech) {
          st.audioUrl = "";
          st.statusText = "Playing via browser speech synthesis (no API key entered).";
          draw();
          const utter = new SpeechSynthesisUtterance(spokenText);
          utter.lang = "en-US";
          utter.rate = 0.98;
          window.speechSynthesis.speak(utter);
        } else {
          st.statusText = "No audio engine available—open transcript.";
          draw();
        }
      });
    }

    if (stopBtn) {
      stopBtn.addEventListener("click", () => {
        stopAllAudio();
        st.statusText = "Stopped.";
        draw();
      });
    }

    if (scriptBtn) {
      scriptBtn.addEventListener("click", () => {
        st.showScript = !st.showScript;
        draw();
      });
    }
  };
  draw();
}

function renderQuiz(containerId, questions) {
  const container = document.getElementById(containerId);
  if (!container) return;
  const st = { idx: 0, score: 0, done: false };
  const letters = ["A", "B", "C", "D"];

  const render = () => {
    if (st.done) {
      container.innerHTML = `
        <div class="quiz-feedback correct">
          🎯 Drill completed: <b>${st.score} / ${questions.length}</b> correct!
        </div>
        <div style="text-align:center;">
          <button class="try-again-btn" id="${containerId}-retry">🔄 Try Again</button>
        </div>
      `;
      const retryBtn = document.getElementById(containerId + "-retry");
      if (retryBtn) {
        retryBtn.addEventListener("click", () => {
          st.idx = 0; st.score = 0; st.done = false; render();
        });
      }
      return;
    }
    const q = questions[st.idx];
    container.innerHTML = `
      <div style="margin-bottom:10px; font-size:13px; color:var(--mute); font-weight:700;">
        Question ${st.idx + 1} of ${questions.length} · Score: ${st.score}
      </div>
      <div style="font-size:16.5px; font-weight:700; color:var(--purpled); margin-bottom:14px; line-height:1.5;">
        ${q.prompt}
      </div>
      <div class="quiz-options">
        ${q.options.map((opt, i) => `
          <button class="quiz-option" data-i="${i}">
            <b>${letters[i]}.</b> ${opt}
          </button>
        `).join("")}
      </div>
      <div id="${containerId}-fb"></div>
    `;
    container.querySelectorAll(".quiz-option").forEach(btn => {
      btn.addEventListener("click", () => {
        const chosen = parseInt(btn.dataset.i, 10);
        const opts = container.querySelectorAll(".quiz-option");
        opts.forEach(o => { o.disabled = true; });
        const fb = document.getElementById(`${containerId}-fb`);
        if (chosen === q.correct) {
          opts[chosen].classList.add("correct");
          st.score++;
          if (fb) fb.innerHTML = `<div class="quiz-feedback correct">✅ Spot on! ${q.note || ""}</div>`;
        } else {
          opts[chosen].classList.add("wrong");
          opts[q.correct].classList.add("correct");
          if (fb) fb.innerHTML = `<div class="quiz-feedback wrong">❌ Correct answer: <b>${letters[q.correct]}</b>. ${q.note || ""}</div>`;
        }
        setTimeout(() => {
          st.idx++;
          if (st.idx >= questions.length) st.done = true;
          render();
        }, 1850);
      });
    });
  };
  render();
}

function renderUnscramble(containerId, targetSentence, chipsList) {
  const container = document.getElementById(containerId);
  if (!container) return;
  const shuffle = arr => arr.map(v => [Math.random(), v]).sort((a, b) => a[0] - b[0]).map(v => v[1]);
  const initial = chipsList.map((t, i) => ({ t, id: i }));
  const st = { bank: shuffle(initial), built: [], checked: false, ok: false };

  const render = () => {
    const fbHtml = st.checked
      ? (st.ok
          ? `<span style="color:#1e5c22;">✅ Clean syntax! ${targetSentence}</span>`
          : `<span style="color:#9c2e5c;">Check word order. Target: ${targetSentence}</span>`)
      : "";
    container.innerHTML = `
      <div class="unscramble-built">
        ${st.built.length === 0
          ? "<span style=\"color:var(--mute); font-style:italic; font-size:14px;\">Tap chips in order to build the sentence...</span>"
          : st.built.map(b => `<button class="word-chip built" data-id="${b.id}" ${st.checked ? "disabled" : ""}>${b.t}</button>`).join("")
        }
      </div>
      <div class="unscramble-bank">
        ${st.bank.map(b => `<button class="word-chip" data-id="${b.id}" ${st.checked ? "disabled" : ""}>${b.t}</button>`).join("")}
      </div>
      <div style="text-align:center; margin-top:12px;">
        ${!st.checked
          ? `<button class="try-again-btn" id="${containerId}-ck" ${st.bank.length > 0 ? "disabled" : ""}>Check Sentence</button>`
          : `<button class="try-again-btn" id="${containerId}-rt">🔄 Try Again</button>`
        }
      </div>
      <div style="text-align:center; margin-top:8px; font-weight:700;">${fbHtml}</div>
    `;
    if (!st.checked) {
      container.querySelectorAll(".unscramble-bank .word-chip").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = parseInt(btn.dataset.id, 10);
          const found = st.bank.find(x => x.id === id);
          st.bank = st.bank.filter(x => x.id !== id);
          st.built.push(found);
          render();
        });
      });
      container.querySelectorAll(".unscramble-built .word-chip").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = parseInt(btn.dataset.id, 10);
          const found = st.built.find(x => x.id === id);
          st.built = st.built.filter(x => x.id !== id);
          st.bank.push(found);
          render();
        });
      });
      const ck = document.getElementById(containerId + "-ck");
      if (ck) {
        ck.addEventListener("click", () => {
          st.checked = true;
          st.ok = st.built.map(x => x.t).join(" ") === targetSentence;
          render();
        });
      }
    } else {
      const rt = document.getElementById(containerId + "-rt");
      if (rt) {
        rt.addEventListener("click", () => {
          st.bank = shuffle(initial); st.built = []; st.checked = false; st.ok = false; render();
        });
      }
    }
  };
  render();
}

function renderMatch(containerId, pairs) {
  const container = document.getElementById(containerId);
  if (!container) return;
  const shuffle = arr => arr.map(v => [Math.random(), v]).sort((a, b) => a[0] - b[0]).map(v => v[1]);
  let st;
  const reset = () => {
    st = {
      left: shuffle(pairs.map((p, i) => ({ t: p[0], id: i }))),
      right: shuffle(pairs.map((p, i) => ({ t: p[1], id: i }))),
      selL: null, selR: null, matched: new Set(), errors: 0, flash: null
    };
  };
  reset();

  const render = () => {
    const done = st.matched.size === pairs.length;
    container.innerHTML = `
      <div class="match-cols">
        <div class="match-col">
          <div class="match-head">Cue / Situation</div>
          ${st.left.map(l => `
            <button class="match-item ${st.matched.has(l.id) ? "matched" : ""} ${st.selL === l.id ? "selected" : ""} ${st.flash && st.flash[0] === l.id ? "shake" : ""}"
              data-side="L" data-id="${l.id}" ${st.matched.has(l.id) ? "disabled" : ""}>${l.t}</button>
          `).join("")}
        </div>
        <div class="match-col">
          <div class="match-head">Exam Strategy</div>
          ${st.right.map(r => `
            <button class="match-item fn ${st.matched.has(r.id) ? "matched" : ""} ${st.selR === r.id ? "selected" : ""} ${st.flash && st.flash[1] === r.id ? "shake" : ""}"
              data-side="R" data-id="${r.id}" ${st.matched.has(r.id) ? "disabled" : ""}>${r.t}</button>
          `).join("")}
        </div>
      </div>
      ${done
        ? `<div class="quiz-feedback correct">✅ All matched! Mistakes: ${st.errors}</div><div style="text-align:center;"><button class="try-again-btn" id="${containerId}-retry">🔄 Play Again</button></div>`
        : "<p style=\"text-align:center; color:var(--mute); font-size:13px; margin-top:8px;\">Tap a cue on the left, then its strategy on the right.</p>"
      }
    `;
    container.querySelectorAll(".match-item").forEach(btn => {
      btn.addEventListener("click", () => {
        const id = parseInt(btn.dataset.id, 10);
        if (btn.dataset.side === "L") st.selL = id; else st.selR = id;
        if (st.selL !== null && st.selR !== null) {
          if (st.selL === st.selR) {
            st.matched.add(st.selL);
            st.flash = null;
          } else {
            st.errors++;
            st.flash = [st.selL, st.selR];
            setTimeout(() => { st.flash = null; render(); }, 650);
          }
          st.selL = null;
          st.selR = null;
        }
        render();
      });
    });
    if (done) {
      const retryBtn = document.getElementById(containerId + "-retry");
      if (retryBtn) retryBtn.addEventListener("click", () => { reset(); render(); });
    }
  };
  render();
}

function renderTimerWidget(containerId, secondsTotal) {
  const el = document.getElementById(containerId);
  if (!el) return;
  if (!timers[containerId]) timers[containerId] = { left: secondsTotal, running: false, h: null };
  const t = timers[containerId];
  const draw = () => {
    if (!document.getElementById(containerId)) { clearInterval(t.h); t.running = false; return; }
    const m = String(Math.floor(t.left / 60)).padStart(2, "0");
    const s = String(t.left % 60).padStart(2, "0");
    el.innerHTML = `
      <div class="timer-inline">
        <div class="timer-clock ${t.left <= 10 ? "warn" : ""}">⏱️ ${m}:${s}</div>
        <button class="timer-btn" id="${containerId}-go">${t.running ? "⏸ Pause" : "▶ Start Timer"}</button>
        <button class="timer-btn ghost" id="${containerId}-rs">↺ Reset</button>
        ${t.left === 0 ? "<span style=\"font-weight:800; color:#9c2e5c;\">⏰ Time up!</span>" : ""}
      </div>
    `;
    const goBtn = document.getElementById(containerId + "-go");
    const rsBtn = document.getElementById(containerId + "-rs");
    if (goBtn) {
      goBtn.onclick = () => {
        if (t.running) { clearInterval(t.h); t.running = false; }
        else {
          t.running = true;
          t.h = setInterval(() => {
            t.left = Math.max(0, t.left - 1);
            if (t.left === 0) { clearInterval(t.h); t.running = false; }
            draw();
          }, 1000);
        }
        draw();
      };
    }
    if (rsBtn) {
      rsBtn.onclick = () => {
        clearInterval(t.h); t.running = false; t.left = secondsTotal; draw();
      };
    }
  };
  draw();
}

function renderDiscussionLab(containerId, promptEn, promptEs, minW, maxW, placeholderText) {
  const container = document.getElementById(containerId);
  if (!container) return;
  if (labDrafts[containerId] === undefined) labDrafts[containerId] = "";
  const checks = [
    { label: "Clear position / thesis statement upfront", test: t => /\b(i believe|in my view|in my opinion|from my perspective|while|whereas|i argue)\b/i.test(t) },
    { label: "Engages with or contrasts another viewpoint", test: t => /\b(like|unlike|building on|agree with|disagree with|add to|point out|whereas|while)\b/i.test(t) },
    { label: "Includes a concrete reason or example", test: t => /\b(for example|for instance|such as|because|since|as a result)\b/i.test(t) },
    { label: `Target length (${minW}–${maxW} words)`, test: t => { const n = t.trim().split(/\s+/).filter(Boolean).length; return n >= minW && n <= maxW; } },
    { label: "Appropriate register (no chat slang)", test: t => t.trim().length > 0 && !/\b(gonna|wanna|kinda|sorta|lol|btw)\b/i.test(t) },
  ];
  container.innerHTML = `
    <div class="bilingual">
      <p class="lang-en">${promptEn}</p>
      <p class="lang-es">${promptEs}</p>
    </div>
    <textarea id="${containerId}-ta" class="writing-ta" placeholder="${placeholderText}">${labDrafts[containerId]}</textarea>
    <div class="wc" id="${containerId}-wc"></div>
    <div class="checklist" id="${containerId}-cl"></div>
  `;
  const ta = document.getElementById(containerId + "-ta");
  const update = () => {
    if (!ta) return;
    labDrafts[containerId] = ta.value;
    const n = ta.value.trim().split(/\s+/).filter(Boolean).length;
    const wcEl = document.getElementById(containerId + "-wc");
    const clEl = document.getElementById(containerId + "-cl");
    if (wcEl) wcEl.textContent = `${n} ${n === 1 ? "word" : "words"}`;
    const ok = checks.filter(c => c.test(ta.value)).length;
    if (clEl) {
      clEl.innerHTML =
        checks.map(c => `<div class="check-row ${c.test(ta.value) ? "ok" : ""}"><span class="check-dot">${c.test(ta.value) ? "✓" : ""}</span>${c.label}</div>`).join("") +
        `<div class="check-score">${ok} / ${checks.length} criteria met</div>`;
    }
  };
  if (ta) {
    ta.addEventListener("input", update);
    update();
  }
}

const totalEl = document.getElementById("prog-total");
if (totalEl) totalEl.textContent = sections.length;

function renderSection() {
  stopAllAudio();
  const content = document.getElementById("content");
  if (!content) return;
  content.innerHTML = sections[state.section].render();
  sections[state.section].onMount();

  const prevBtn = document.getElementById("prev-btn");
  const nextBtn = document.getElementById("next-btn");
  if (prevBtn) prevBtn.disabled = state.section === 0;
  if (nextBtn) {
    if (state.section === sections.length - 1) {
      nextBtn.style.display = "none";
    } else {
      nextBtn.style.display = "";
      nextBtn.textContent = state.section === 0 ? "Start 50m Refresh →" : "Next →";
    }
  }
  const pct = Math.round(((state.section + 1) * 100) / sections.length);
  const fillEl = document.getElementById("progress-fill");
  const currEl = document.getElementById("prog-current");
  if (fillEl) fillEl.style.width = pct + "%";
  if (currEl) currEl.textContent = state.section + 1;
  window.scrollTo({ top: 0, behavior: "smooth" });
}

const nextBtnEl = document.getElementById("next-btn");
const prevBtnEl = document.getElementById("prev-btn");
if (nextBtnEl) {
  nextBtnEl.addEventListener("click", () => {
    if (state.section < sections.length - 1) {
      state.section++;
      renderSection();
    }
  });
}
if (prevBtnEl) {
  prevBtnEl.addEventListener("click", () => {
    if (state.section > 0) {
      state.section--;
      renderSection();
    }
  });
}

renderSection();
